<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="100%" height="100%">
  <defs>
    <!-- Primary Green Gradient -->
    <linearGradient id="tokenomics-brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35a97c" />
      <stop offset="60%" stop-color="#178f63" />
      <stop offset="100%" stop-color="#0f6b4a" />
    </linearGradient>

    <!-- Accent Purple/Violet Gradient -->
    <linearGradient id="tokenomics-accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Coin Ring Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield / Token Base -->
  <path
    d="M 20 2 L 34 10 L 34 30 L 20 38 L 6 30 L 6 10 Z"
    fill="url(#tokenomics-brand-grad)"
    rx="2"
  />

  <!-- Inner Dark Token Core -->
  <path
    d="M 20 5.2 L 31.5 11.8 L 31.5 28.2 L 20 34.8 L 8.5 28.2 L 8.5 11.8 Z"
    fill="#0f172a"
    opacity="0.92"
  />

  <!-- Layered Stacked Token / Coin Rings -->
  <!-- Bottom Coin (Cache Layer) -->
  <ellipse cx="20" cy="27" rx="8" ry="3" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.7" />
  
  <!-- Middle Coin (Input Layer) -->
  <ellipse cx="20" cy="22" rx="8" ry="3" fill="none" stroke="#35a97c" stroke-width="1.4" />

  <!-- Top Coin (Output Layer - Glowing Violet Accent) -->
  <ellipse cx="20" cy="17" rx="8" ry="3" fill="none" stroke="url(#tokenomics-accent-grad)" stroke-width="1.6" filter="url(#glow)" />

  <!-- Upward Trend Chart Line connecting the Tokens -->
  <path
    d="M 13 25 L 18 20 L 22 21 L 27 13"
    fill="none"
    stroke="#35a97c"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Glowing AI Spark Node at top right of trend line -->
  <circle cx="27" cy="13" r="2.2" fill="#a855f7" />
  <circle cx="27" cy="13" r="1" fill="#ffffff" />
</svg>
